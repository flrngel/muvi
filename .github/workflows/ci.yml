name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'README.md', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: windows-2025, python: '3.12'}
          - {os: macos-15, python: '3.12'}
          - {os: macos-15-intel, python: '3.12'}
          - {os: macos-15, python: '3.13'}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Install platform-compatible dependencies
        run: |
          uv venv --python '${{ matrix.python }}'
          uv pip install --python .venv --only-binary cryptography --group dev '.[mcp]'
      - name: Lint and test including MCP
        run: |
          uv run --no-sync ruff check genome tests scripts
          uv run --no-sync python -m pytest -q
      - name: Build and smoke-test the core wheel in isolation
        run: |
          uv build --wheel
          uv run --no-project --isolated --python '${{ matrix.python }}' --with ./dist/*.whl python scripts/smoke_install.py
