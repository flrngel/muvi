[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "muvi-genome"
version = "0.2.0"
description = "A local music evidence engine, listening workspace, and tools for language models."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "soundfile>=0.13,<1",
  "pydantic>=2.11,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "matplotlib>=3.10,<4",
  "mcp>=1.12,<2",
  "filelock>=3.18,<4",
]

[project.scripts]
muvi = "genome.cli:main"
music-genome = "genome.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "psutil>=6,<8"]

[tool.hatch.build.targets.wheel]
packages = ["genome"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

