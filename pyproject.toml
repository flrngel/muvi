[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "muvi-genome"
version = "0.5.2"
description = "Music evidence for your terminal and language models. Local analysis, grounded answers, optional MCP."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "soundfile>=0.13,<1",
  "pydantic>=2.11,<3",
  "matplotlib>=3.10,<4",
  "filelock>=3.18,<4",
]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]

[project.scripts]
muvi = "genome.cli:main"
music-genome = "genome.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "psutil>=6,<8"]

[tool.hatch.build.targets.wheel]
packages = ["genome"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

